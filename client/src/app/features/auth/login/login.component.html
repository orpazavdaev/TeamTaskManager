<div class="auth-container">
  <div class="auth-card">
    <h1>Login</h1>
    <p class="subtitle">Sign in to your account</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="Enter your email"
          [class.error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
        />
        <span
          class="error-message"
          *ngIf="loginForm.get('email')?.hasError('required') && loginForm.get('email')?.touched"
        >
          Email is required
        </span>
        <span
          class="error-message"
          *ngIf="loginForm.get('email')?.hasError('email') && loginForm.get('email')?.touched"
        >
          Please enter a valid email
        </span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Enter your password"
          [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        />
        <span
          class="error-message"
          *ngIf="
            loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched
          "
        >
          Password is required
        </span>
        <span
          class="error-message"
          *ngIf="
            loginForm.get('password')?.hasError('minlength') && loginForm.get('password')?.touched
          "
        >
          Password must be at least 6 characters
        </span>
      </div>

      <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button type="submit" class="btn-primary" [disabled]="loginForm.invalid || isLoading">
        {{ isLoading ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <p class="auth-link">Don't have an account? <a routerLink="/auth/register">Register</a></p>
  </div>
</div>
