<div class="modal-overlay" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ task ? 'Edit Task' : 'Create New Task' }}</h2>
      <button class="btn-close" (click)="closeModal()">×</button>
    </div>

    <form [formGroup]="taskForm" (ngSubmit)="onSubmit()" class="task-form">
      <div class="form-group">
        <label for="title">Title *</label>
        <input
          id="title"
          type="text"
          formControlName="title"
          placeholder="Enter task title"
          [class.error]="taskForm.get('title')?.invalid && taskForm.get('title')?.touched"
        />
        <span
          class="error-message"
          *ngIf="taskForm.get('title')?.hasError('required') && taskForm.get('title')?.touched"
        >
          Title is required
        </span>
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea
          id="description"
          formControlName="description"
          placeholder="Enter task description"
          rows="4"
        ></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="status">Status</label>
          <select id="status" formControlName="status">
            <option [value]="TaskStatus.TODO">TO DO</option>
            <option [value]="TaskStatus.IN_PROGRESS">IN PROGRESS</option>
            <option [value]="TaskStatus.DONE">DONE</option>
          </select>
        </div>

        <div class="form-group">
          <label for="priority">Priority</label>
          <select id="priority" formControlName="priority">
            <option [value]="TaskPriority.LOW">Low</option>
            <option [value]="TaskPriority.MEDIUM">Medium</option>
            <option [value]="TaskPriority.HIGH">High</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Assign To</label>
        <div class="users-container">
          <div class="selected-users" *ngIf="selectedUsers().length > 0">
            <div *ngFor="let user of selectedUsers()" class="user-badge" (click)="toggleUser(user)">
              <span class="user-avatar" [style.background-color]="getUserAvatarColor(user)">
                {{ getUserInitials(user) }}
              </span>
              <span class="user-name">{{ user.name }}</span>
              <span class="remove-user">×</span>
            </div>
          </div>
          <div class="users-dropdown">
            <div
              *ngFor="let user of availableUsers()"
              class="user-option"
              [class.selected]="isUserSelected(user)"
              (click)="toggleUser(user)"
            >
              <span class="user-avatar" [style.background-color]="getUserAvatarColor(user)">
                {{ getUserInitials(user) }}
              </span>
              <div class="user-info">
                <span class="user-name">{{ user.name }}</span>
                <span class="user-email">{{ user.email }}</span>
              </div>
              <span class="check-mark" *ngIf="isUserSelected(user)">✓</span>
            </div>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>Labels</label>
        <div class="labels-container">
          <button
            type="button"
            *ngFor="let label of availableLabels()"
            (click)="toggleLabel(label)"
            [class.selected]="isLabelSelected(label)"
            class="label-button"
          >
            {{ label }}
          </button>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="closeModal()">Cancel</button>
        <button type="submit" class="btn-primary" [disabled]="taskForm.invalid">
          {{ task ? 'Update' : 'Create' }} Task
        </button>
      </div>
    </form>
  </div>
</div>
