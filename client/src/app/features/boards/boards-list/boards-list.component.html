<div class="boards-container">
  <header class="boards-header">
    <h1>My Boards</h1>
    <div class="header-actions">
      <input
        type="text"
        placeholder="Search boards..."
        [value]="searchTerm()"
        (input)="searchTerm.set($any($event.target).value)"
        class="search-input"
      />
      <button class="btn-primary" (click)="createBoard()">+ New Board</button>
    </div>
  </header>

  <div class="boards-grid" *ngIf="!isLoading(); else loading">
    <div
      *ngFor="let board of filteredBoards()"
      class="board-card"
      [routerLink]="['/boards', board._id]"
      [style.border-color]="board.color"
    >
      <div class="board-header" [style.background-color]="board.color + '20'">
        <h3>{{ board.name }}</h3>
      </div>
      <div class="board-content">
        <p *ngIf="board.description">{{ board.description }}</p>
        <p class="board-meta" *ngIf="!board.description">
          Created {{ board.createdAt | date : 'short' }}
        </p>
      </div>
    </div>

    <div *ngIf="filteredBoards().length === 0" class="empty-state">
      <p>No boards found. Create your first board!</p>
    </div>
  </div>

  <ng-template #loading>
    <div class="loading">Loading boards...</div>
  </ng-template>
</div>
