<div class="dialog-overlay" (click)="onCancel()">
  <div class="dialog-content" (click)="$event.stopPropagation()">
    <div class="dialog-header">
      <h3>{{ title }}</h3>
    </div>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="dialog-form">
      <div class="dialog-body">
        <div class="form-group">
          <label>{{ label }}</label>
          <input
            type="text"
            formControlName="value"
            [placeholder]="placeholder"
            [class.error]="form.get('value')?.invalid && form.get('value')?.touched"
            autofocus
          />
          <span
            class="error-message"
            *ngIf="form.get('value')?.hasError('required') && form.get('value')?.touched"
          >
            {{ label }} is required
          </span>
        </div>
        <div class="form-group" *ngIf="showPublicOption">
          <label class="checkbox-label">
            <input type="checkbox" formControlName="isPublic" />
            <span>Make this project public (searchable by everyone)</span>
          </label>
        </div>
      </div>
      <div class="dialog-actions">
        <button type="button" class="btn-cancel" (click)="onCancel()">
          {{ cancelText }}
        </button>
        <button type="submit" class="btn-confirm" [disabled]="form.invalid">
          {{ confirmText }}
        </button>
      </div>
    </form>
  </div>
</div>
