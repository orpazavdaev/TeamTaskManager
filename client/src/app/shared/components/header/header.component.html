<header class="app-header">
  <div class="header-content">
    <div class="header-left">
      <div class="logo-container" (click)="navigateHome()">
        <img
          class="logo-icon"
          [src]="isDarkMode() ? '/logo-option-5-dark.svg' : '/logo-option-5.svg'"
          alt="TaskManager Logo"
        />
      </div>
    </div>
    <div class="header-right" *ngIf="user(); else notAuthenticated">
      <nav class="header-nav">
        <a routerLink="/projects" class="nav-link">Projects</a>
        <a routerLink="/calendar" class="nav-link">📅 Calendar</a>
      </nav>
      <div class="user-menu-container">
        <button class="user-name profile-link" (click)="toggleUserMenu()">
          {{ user()?.name }}
        </button>
        <div class="user-menu" *ngIf="showUserMenu()">
          <button class="user-menu-item" (click)="navigateToProfile()">👤 Profile</button>
          <button class="user-menu-item" (click)="logout()">🚪 Logout</button>
        </div>
      </div>
      <button
        class="theme-toggle"
        (click)="toggleTheme()"
        [title]="isDarkMode() ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
      >
        {{ isDarkMode() ? '☀️' : '🌙' }}
      </button>
    </div>
    <ng-template #notAuthenticated>
      <div class="header-right">
        <a routerLink="/auth/login" class="btn-link">Login</a>
      </div>
    </ng-template>
  </div>
</header>
