<svg width="200" height="40" viewBox="0 0 200 40" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo: Abstract network/circuit design in light blue -->
  <g id="logo-icon">
    <!-- Left column: three small dots -->
    <circle cx="6" cy="12" r="1.8" fill="#61a5c2"/>
    <circle cx="6" cy="20" r="1.8" fill="#61a5c2"/>
    <circle cx="6" cy="28" r="1.8" fill="#61a5c2"/>
    
    <!-- Center: large dot with connecting lines -->
    <circle cx="18" cy="20" r="3" fill="#61a5c2"/>
    
    <!-- Lines from center to various points -->
    <line x1="18" y1="20" x2="6" y2="12" stroke="#61a5c2" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="18" y1="20" x2="6" y2="20" stroke="#61a5c2" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="18" y1="20" x2="6" y2="28" stroke="#61a5c2" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="18" y1="20" x2="30" y2="12" stroke="#61a5c2" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="18" y1="20" x2="30" y2="20" stroke="#61a5c2" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="18" y1="20" x2="30" y2="28" stroke="#61a5c2" stroke-width="1.2" stroke-linecap="round"/>
    
    <!-- Right column: three small dots -->
    <circle cx="30" cy="12" r="1.8" fill="#61a5c2"/>
    <circle cx="30" cy="20" r="1.8" fill="#61a5c2"/>
    <circle cx="30" cy="28" r="1.8" fill="#61a5c2"/>
  </g>

  <!-- Text: Task Management -->
  <text x="36" y="24" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#012a4a">Task Management</text>
</svg>
